services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      target: production
    image: ars-monitor-backend:latest
    container_name: ars-monitor-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      ARS_ENVIRONMENT: production
      ARS_MODEL_VERSION: "1.0.0"
      ARS_CORS_ALLOW_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - ./artifacts:/app/artifacts:ro
      - ./checkpoints:/app/checkpoints:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2g

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ars-monitor-frontend:latest
    container_name: ars-monitor-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
      NEXT_PUBLIC_WS_BASE_URL: ws://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
