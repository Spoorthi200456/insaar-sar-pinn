name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: ghcr.io/${{ github.repository }}/ars-monitor-backend

permissions:
  contents: read
  packages: write

jobs:
  lint:
    name: Lint & static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dev dependencies
        run: pip install ruff black mypy

      - name: Ruff (lint)
        run: ruff check src tests

      - name: Black (format check)
        run: black --check src tests

      - name: mypy (type check)
        run: mypy src || true  # advisory: architecture is intentionally dynamic in places (dataclasses, torch)

  test:
    name: Unit / contract / data-drift tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run schema, dataset, model and loss unit tests
        run: pytest tests/test_schemas.py tests/test_dataset.py tests/test_models.py tests/test_losses.py -v

      - name: Run API contract tests
        run: pytest tests/test_api.py -v

      - name: Data drift smoke check
        run: |
          python - <<'PY'
          import sys
          from src.data.preprocessing import compute_normalization_stats
          from src.training.train import make_synthetic_records
          import numpy as np

          # Fit normalization on a "reference" batch, then check a later
          # "current" batch does not silently drift the design-feature
          # distribution by more than a few standard deviations -- this is a
          # lightweight statistical guard, not a full data-drift monitoring
          # service, and is meant to fail CI loudly if synthetic-data
          # generation (or, in production, an ingestion pipeline change)
          # shifts the feature distribution unexpectedly.
          reference = make_synthetic_records(n_structures=200, seed=1)
          current = make_synthetic_records(n_structures=200, seed=2)

          ref_heights = np.array([r.design.height_m for r in reference])
          cur_heights = np.array([r.design.height_m for r in current])
          stats = compute_normalization_stats(ref_heights)

          z_shift = abs(float(np.mean(cur_heights)) - stats.mean) / max(stats.std, 1e-6)
          print(f"height_m mean z-shift vs reference: {z_shift:.3f}")
          if z_shift > 3.0:
              print("::error::Detected significant data drift in height_m distribution")
              sys.exit(1)
          PY

      - name: Upload coverage summary
        if: always()
        run: pytest tests/ -q --junitxml=test-results.xml

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results.xml

  build-and-push:
    name: Build & push container image
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: production
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            APP_VERSION=${{ github.sha }}

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Trigger deployment
        run: |
          echo "Image ghcr.io/${{ github.repository }}/ars-monitor-backend:${{ github.sha }} is published."
          echo "Wire this step to your infrastructure (e.g. 'kubectl set image', a Terraform"
          echo "apply, or a cloud-run/ECS deploy action) using the DEPLOY_* secrets configured"
          echo "in the 'production' environment for this repository."
