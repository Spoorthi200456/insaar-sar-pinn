[project]
name = "insar-pinn-ars"
version = "1.0.0"
description = "InSAR-PINN framework for Artificial Recharge Structure monitoring"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "slow: long-running known-answer training test (~2-3 min on CPU)",
    "comparison: opt-in review-4 method comparison (~20 min); run with -m comparison",
]
addopts = "-m 'not comparison'"
